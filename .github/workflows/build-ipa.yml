name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r tiktok-repost-remover-unsigned.ipa Payload

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tiktok-repost-remover-unsigned.ipa
          tag_name: ${{ github.ref_name }}
          name: TikTok Repost Remover ${{ github.ref_name }}
          body: |
            Unsigned IPA beta. Sideload with AltStore or Sideloadly using your Apple ID.
            No paywall, no RevenueCat.
          prerelease: true
          draft: false

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-repost-remover-unsigned-ipa
          path: tiktok-repost-remover-unsigned.ipa
